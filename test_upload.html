<!DOCTYPE html>
<html>
<head>
    <title>Upload Test</title>
</head>
<body>
    <h1>Upload Test</h1>
    
    <div>
        <label>Group:</label>
        <select id="groupSelect">
            <option value="">Select group...</option>
            <option value="assistance">assistance</option>
            <option value="common_rules">common_rules</option>
        </select>
    </div>
    
    <div>
        <input type="file" id="fileInput" multiple accept=".pdf">
        <button id="uploadBtn">Upload</button>
    </div>
    
    <div id="result"></div>
    
    <script>
        let token = null;
        let selectedFiles = [];
        
        // Login first
        async function login() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'assistant1', password: 'password1' })
                });
                const result = await response.json();
                token = result.access_token;
                console.log('Logged in successfully');
                document.getElementById('result').innerHTML = 'Logged in successfully';
            } catch (error) {
                console.error('Login failed:', error);
                document.getElementById('result').innerHTML = 'Login failed: ' + error.message;
            }
        }
        
        // Handle file selection
        document.getElementById('fileInput').addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            console.log('Files selected:', selectedFiles.length);
        });
        
        // Handle upload
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            console.log('Upload button clicked');
            
            if (!token) {
                document.getElementById('result').innerHTML = 'Please login first';
                return;
            }
            
            const groupId = document.getElementById('groupSelect').value;
            if (!groupId) {
                document.getElementById('result').innerHTML = 'Please select a group';
                return;
            }
            
            if (selectedFiles.length === 0) {
                document.getElementById('result').innerHTML = 'Please select files';
                return;
            }
            
            try {
                const formData = new FormData();
                selectedFiles.forEach(file => {
                    formData.append('files', file);
                });
                formData.append('group_id', groupId);
                
                console.log('Uploading files...');
                document.getElementById('result').innerHTML = 'Uploading...';
                
                const response = await fetch('/api/documents/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Upload failed');
                }
                
                const result = await response.json();
                console.log('Upload successful:', result);
                document.getElementById('result').innerHTML = 'Upload successful: ' + JSON.stringify(result);
                
            } catch (error) {
                console.error('Upload failed:', error);
                document.getElementById('result').innerHTML = 'Upload failed: ' + error.message;
            }
        });
        
        // Auto-login on page load
        login();
    </script>
</body>
</html>
