<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
        form { margin: 20px 0; }
        input, button { margin: 5px; padding: 8px; }
    </style>
</head>
<body>
    <h1>Login Debug Page</h1>
    
    <div class="debug">
        <h3>Debug Info:</h3>
        <div id="debugInfo">Loading...</div>
    </div>
    
    <form id="loginForm">
        <h3>Login Test:</h3>
        <input type="text" id="username" value="assistant1" placeholder="Username" required>
        <input type="password" id="password" value="password1" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        // Debug info
        const debugInfo = document.getElementById('debugInfo');
        debugInfo.innerHTML = `
            <p>Current URL: ${window.location.href}</p>
            <p>Local Storage Token: ${localStorage.getItem('auth_token') || 'None'}</p>
            <p>JavaScript Loaded: Yes</p>
            <p>DOM Ready: ${document.readyState}</p>
        `;
        
        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<p>Attempting login...</p>';
            
            try {
                console.log('Login attempt:', { username });
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const result = await response.json();
                console.log('Login result:', result);
                
                // Store token
                localStorage.setItem('auth_token', result.access_token);
                
                resultDiv.innerHTML = `
                    <div class="success">
                        <h3>✅ Login Successful!</h3>
                        <p><strong>User:</strong> ${result.user_id}</p>
                        <p><strong>Groups:</strong> ${result.groups.join(', ')}</p>
                        <p><strong>Token:</strong> ${result.access_token.substring(0, 50)}...</p>
                    </div>
                `;
                
                // Test session endpoint
                setTimeout(async () => {
                    try {
                        const sessionResponse = await fetch('/api/auth/session', {
                            headers: {
                                'Authorization': `Bearer ${result.access_token}`
                            }
                        });
                        
                        if (sessionResponse.ok) {
                            const sessionData = await sessionResponse.json();
                            console.log('Session data:', sessionData);
                            resultDiv.innerHTML += `
                                <div class="success">
                                    <h3>✅ Session Validation Successful!</h3>
                                    <pre>${JSON.stringify(sessionData, null, 2)}</pre>
                                </div>
                            `;
                        } else {
                            const errorText = await sessionResponse.text();
                            console.error('Session validation failed:', errorText);
                            resultDiv.innerHTML += `
                                <div class="error">
                                    <h3>❌ Session Validation Failed</h3>
                                    <p>Status: ${sessionResponse.status}</p>
                                    <p>Error: ${errorText}</p>
                                </div>
                            `;
                        }
                    } catch (sessionError) {
                        console.error('Session test error:', sessionError);
                        resultDiv.innerHTML += `
                            <div class="error">
                                <h3>❌ Session Test Error</h3>
                                <p>${sessionError.message}</p>
                            </div>
                        `;
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Login Failed</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        });
        
        // Test if main app elements exist
        setTimeout(() => {
            const elements = {
                'loginForm': document.getElementById('loginForm'),
                'mainApp': document.getElementById('mainApp'),
                'userInfo': document.getElementById('userInfo')
            };
            
            console.log('Main app elements check:', elements);
            
            let elementsInfo = '<h4>Main App Elements:</h4>';
            for (const [name, element] of Object.entries(elements)) {
                elementsInfo += `<p>${name}: ${element ? '✅ Found' : '❌ Not found'}</p>`;
            }
            
            debugInfo.innerHTML += elementsInfo;
        }, 500);
    </script>
</body>
</html>
